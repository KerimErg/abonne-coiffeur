    C300 900, 352 858, 412 820
    C398 806, 384 792, 384 770
    C384 748, 372 742, 360 726
    C348 712, 338 704, 340 686
    C298 678, 300 628, 322 604
    C300 566, 322 470, 396 452
    C470 434, 560 452, 606 500
    C654 552, 660 636, 646 712
    C640 770, 660 806, 700 848
    C742 890, 762 984, 762 1080
    Z" fill="#14263F"/>
  <!-- nez / lèvre (léger dégagement clair du profil) -->
  <path d="M322 604 C312 612, 306 624, 314 636 C320 646, 332 648, 340 642"
        fill="none" stroke="#C6D0DC" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
