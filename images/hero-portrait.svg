<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Coupe homme et barbe — Aboné Coiffeur">
  <rect width="900" height="1080" fill="#E7EBF0"/>
  <circle cx="452" cy="430" r="330" fill="#C6D0DC"/>
  <!-- profil masculin (face à gauche) : cheveux courts + barbe -->
